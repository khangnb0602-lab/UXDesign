document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

        s.textContent = await r.text();
        s.removeAttribute('src');

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

 <div class=\"log-entry\" style=\"padding:4px 12px;\">[INF] webmaster contact located: webmaster@healthbc.gov<\u002Fdiv>\n                <div class=\"log-entry ok\" style=\"padding:4px 12px;\">[INF] automated report dispatched ✓<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fmain>\n\n  <!-- ── Bottom nav ────────────────────────────────── -->\n  <footer class=\"bottom-nav\">\n    <div class=\"step-info\">\n      <div class=\"step-info-label\" id=\"nav-label\">Home<\u002Fdiv>\n      <div class=\"step-info-text\" id=\"nav-text\">Maria needs to find an after-hours clinic for her daughter's fever. She opens the BC Health Services website on her phone.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"nav-btns\">\n      <button class=\"nav-btn\" id=\"btn-back\" onclick=\"navigate(-1)\" disabled=\"\">← Back<\u002Fbutton>\n      <button class=\"nav-btn primary\" id=\"btn-next\" onclick=\"navigate(1)\">Next →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <script>\n    let currentStep = 0;\n    let currentDevice = 'mobile';\n    const totalSteps = 6;\n\n    const stepInfo = [\n      { label: 'Home', text: 'Maria needs to find an after-hours clinic for her daughter\\'s fever. She opens the BC Health Services website on her phone.' },\n      { label: 'Step 1 of 4 · The Problem', text: 'Maria taps After-Hours Clinics — but the table is broken and unreadable on mobile. She\\'s stuck scrolling and zooming.' },\n      { label: 'App Homepage · AccessAI Activates', text: 'AccessAI detects the rendering failure and presents its home screen — showing Maria what went wrong and offering to fix the page or report the issue.' },\n      { label: 'Step 2 of 4 · Detection', text: 'The app detects the broken table structure and begins extracting the clinic data into a clean, readable format.' },\n      { label: 'Step 3 of 4 · Clean Result', text: 'Maria instantly sees a readable list of nearby clinics sorted by distance. Tap any card to select a clinic.' },\n      { label: 'Step 4 of 4 · Error Reported', text: 'The app logs the rendering failure, locates the webmaster contact, and sends an automated report — closing the feedback loop.' }\n    ];\n\n    function setDevice(device) {\n      currentDevice = device;\n      document.getElementById('device-mobile').style.display = device === 'mobile' ? 'block' : 'none';\n      document.getElementById('device-desktop').style.display = device === 'desktop' ? 'block' : 'none';\n      document.getElementById('btn-mobile').classList.toggle('active', device === 'mobile');\n      document.getElementById('btn-desktop').classList.toggle('active', device === 'desktop');\n      updateStep(currentStep);\n    }\n\n    function updateStep(step) {\n      // Hide all step content\n      for (let i = 0; i < totalSteps; i++) {\n        const mEl = document.getElementById('m-step-' + i);\n        const dEl = document.getElementById('d-step-' + i);\n        if (mEl) mEl.classList.remove('visible');\n        if (dEl) dEl.classList.remove('visible');\n      }\n\n      // Show current step\n      const mCurrent = document.getElementById('m-step-' + step);\n      const dCurrent = document.getElementById('d-step-' + step);\n      if (mCurrent) mCurrent.classList.add('visible');\n      if (dCurrent) dCurrent.classList.add('visible');\n\n      // Update dots\n      document.querySelectorAll('.step-dot').forEach((dot, i) => {\n        dot.classList.remove('active', 'done');\n        if (i < step) dot.classList.add('done');\n        if (i === step) dot.classList.add('active');\n      });\n\n      // Update nav text\n      document.getElementById('nav-label').textContent = stepInfo[step].label;\n      document.getElementById('nav-text').textContent = stepInfo[step].text;\n\n      // Update buttons\n      document.getElementById('btn-back').disabled = step === 0;\n      const nextBtn = document.getElementById('btn-next');\n      if (step === totalSteps - 1) {\n        nextBtn.textContent = '↺ Restart';\n        nextBtn.onclick = () => { currentStep = -1; navigate(1); };\n      } else {\n        nextBtn.textContent = 'Next →';\n        nextBtn.onclick = () => navigate(1);\n      }\n\n      // Trigger step 4 animation (detection)\n      if (step === 3) {\n        setTimeout(() => {\n          const mp = document.getElementById('m-progress');\n          const dp = document.getElementById('d-progress');\n          if (mp) mp.classList.add('running');\n          if (dp) dp.classList.add('running');\n        }, 100);\n      } else {\n        const mp = document.getElementById('m-progress');\n        const dp = document.getElementById('d-progress');\n        if (mp) { mp.classList.remove('running'); void mp.offsetWidth; }\n        if (dp) { dp.classList.remove('running'); void dp.offsetWidth; }\n      }\n    }\n\n    function navigate(dir) {\n      currentStep = Math.max(0, Math.min(totalSteps - 1, currentStep + dir));\n      updateStep(currentStep);\n    }\n\n    function goTo(step) {\n      currentStep = step;\n      updateStep(step);\n    }\n\n    function selectClinic(el, prefix) {\n      const container = document.getElementById(prefix + '-clinics');\n      if (!container) return;\n      container.querySelectorAll('.clinic-card, .m-clinic-card').forEach(c => c.classList.remove('selected'));\n      el.classList.add('selected');\n      const nameEl = el.querySelector('.clinic-name, .m-clinic-name');\n      const distEl = el.querySelector('.clinic-dist, .m-clinic-dist');\n      const name = nameEl ? nameEl.textContent : '';\n      const dist = distEl ? distEl.textContent : '';\n      const banner = document.getElementById(prefix + '-selected-banner');\n      if (banner) {\n        banner.textContent = '✓ ' + name + ' — ' + dist + ' away';\n        banner.classList.add('show');\n      }\n    }\n  <\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
